{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "techstore.fullname" . }}-secret
  labels:
    {{- include "techstore.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.dbPassword | default .Values.postgres.password | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.user | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.dbPassword | default .Values.postgres.password | quote }}
  INTERNAL_API_KEY: {{ .Values.secret.internalApiKey | quote }}
{{- end }}
