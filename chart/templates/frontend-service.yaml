apiVersion: v1
kind: Service
metadata:
  name: {{ include "techstore.fullname" . }}-frontend
  labels:
    {{- include "techstore.labels" . | nindent 4 }}
    app: frontend
    tier: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "techstore.selectorLabels" . | nindent 4 }}
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: 80
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
