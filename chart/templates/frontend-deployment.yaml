apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "techstore.fullname" . }}-frontend
  labels:
    {{- include "techstore.labels" . | nindent 4 }}
    app: frontend
    tier: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "techstore.selectorLabels" . | nindent 6 }}
      app: frontend
  template:
    metadata:
      labels:
        {{- include "techstore.labels" . | nindent 8 }}
        app: frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "techstore.fullname" . }}-config
                  key: APP_ENVIRONMENT
            - name: APP_STORE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "techstore.fullname" . }}-config
                  key: APP_STORE_NAME
            - name: PRODUCT_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "techstore.fullname" . }}-config
                  key: PRODUCT_SERVICE_HOST
            - name: ORDER_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "techstore.fullname" . }}-config
                  key: ORDER_SERVICE_HOST
          volumeMounts:
            - name: store-config-volume
              mountPath: /usr/share/nginx/html/config/store-config.json
              subPath: store-config.json
              readOnly: true
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /k8s-info
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /k8s-info
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: store-config-volume
          configMap:
            name: {{ include "techstore.fullname" . }}-config
            items:
              - key: store-config.json
                path: store-config.json
