# Default values for techstore chart (Development environment defaults).
nameOverride: ""
fullnameOverride: ""

# Application ConfigMap parameters
config:
  appStoreName: "DevOps TechStore (Helm Dev)"
  appEnvironment: "helm-dev"
  loggingLevel: "INFO"
  showSql: "false"
  currency: "USD"
  banner: "Лабораторна робота №4 • Helm Chart (Development)"

# Secrets for PostgreSQL and internal API
secret:
  internalApiKey: "k8s-demo-internal-api-key"
  dbPassword: "k8s-demo-db-password-2026"

# Frontend microservice (Nginx SPA + Reverse Proxy)
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/vlkorolenko/devops-lab1/frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      cpu: "150m"
      memory: "64Mi"

# Product Service microservice (Spring Boot)
productService:
  replicaCount: 1
  image:
    repository: ghcr.io/vlkorolenko/devops-lab1/product-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: "100m"
      memory: "160Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

# Order Service microservice (Spring Boot)
orderService:
  replicaCount: 1
  image:
    repository: ghcr.io/vlkorolenko/devops-lab1/order-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      cpu: "100m"
      memory: "160Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

# PostgreSQL database
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: "shop_db"
  user: "shop_user"
  password: "k8s-demo-db-password-2026"
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "200m"
      memory: "192Mi"

# Ingress configuration (disabled by default in dev)
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
