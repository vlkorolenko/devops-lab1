apiVersion: v1
kind: Service
metadata:
  name: {{ include "techstore.fullname" . }}-order-service
  labels:
    {{- include "techstore.labels" . | nindent 4 }}
    app: order-service
    tier: backend
spec:
  type: {{ .Values.orderService.service.type }}
  selector:
    {{- include "techstore.selectorLabels" . | nindent 4 }}
    app: order-service
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.orderService.service.port }}
      targetPort: 8082
