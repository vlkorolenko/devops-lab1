apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "techstore.fullname" . }}-config
  labels:
    {{- include "techstore.labels" . | nindent 4 }}
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ include "techstore.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database }}"
  APP_ENVIRONMENT: {{ .Values.config.appEnvironment | quote }}
  APP_STORE_NAME: {{ .Values.config.appStoreName | quote }}
  SPRING_JPA_SHOW_SQL: {{ .Values.config.showSql | quote }}
  LOGGING_LEVEL_COM_DEVOPS_SHOP: {{ .Values.config.loggingLevel | quote }}
  PRODUCT_SERVICE_HOST: "{{ include "techstore.fullname" . }}-product-service.{{ .Release.Namespace }}.svc.cluster.local"
  ORDER_SERVICE_HOST: "{{ include "techstore.fullname" . }}-order-service.{{ .Release.Namespace }}.svc.cluster.local"
  store-config.json: |
    {
      "storeName": {{ .Values.config.appStoreName | quote }},
      "environment": {{ .Values.config.appEnvironment | quote }},
      "currency": {{ .Values.config.currency | quote }},
      "banner": {{ .Values.config.banner | quote }}
    }
