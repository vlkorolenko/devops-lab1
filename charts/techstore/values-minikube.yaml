# Configuration overrides for Minikube environment managed by Argo CD
existingSecret: techstore-secret

config:
  appStoreName: "DevOps TechStore (Argo CD Minikube)"
  appEnvironment: "argocd-minikube"
  banner: "Лабораторна робота №5 • GitOps через Argo CD"

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/vlkorolenko/devops-lab1/frontend
    tag: "9.9.9"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30080

productService:
  replicaCount: 1
  image:
    repository: ghcr.io/vlkorolenko/devops-lab1/product-service
    tag: "1.1.0"
    pullPolicy: IfNotPresent

orderService:
  replicaCount: 1
  image:
    repository: ghcr.io/vlkorolenko/devops-lab1/order-service
    tag: "1.1.0"
    pullPolicy: IfNotPresent

postgres:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi

ingress:
  enabled: false
