server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Root for static web files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy /api/products and /api/products/* to product-service
    location /api/products {
        proxy_pass http://product-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /api/orders and /api/orders/* to order-service
    location /api/orders {
        proxy_pass http://order-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health endpoints for frontend system diagnostics
    location /actuator/product-service/ {
        proxy_pass http://product-service:8081/actuator/;
    }

    location /actuator/order-service/ {
        proxy_pass http://order-service:8082/actuator/;
    }

    # Fallback to index.html for Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
