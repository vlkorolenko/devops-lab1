server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Dynamic DNS resolver populated by Nginx entrypoint from /etc/resolv.conf
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Root for static web files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy /api/products and /api/products/* to product-service
    location /api/products {
        set $product_upstream http://${PRODUCT_SERVICE_HOST}:8081;
        proxy_pass $product_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /api/orders and /api/orders/* to order-service
    location /api/orders {
        set $order_upstream http://${ORDER_SERVICE_HOST}:8082;
        proxy_pass $order_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health endpoints for frontend system diagnostics
    location /actuator/product-service/ {
        set $product_upstream http://${PRODUCT_SERVICE_HOST}:8081;
        rewrite ^/actuator/product-service/(.*)$ /actuator/$1 break;
        proxy_pass $product_upstream;
    }

    location /actuator/order-service/ {
        set $order_upstream http://${ORDER_SERVICE_HOST}:8082;
        rewrite ^/actuator/order-service/(.*)$ /actuator/$1 break;
        proxy_pass $order_upstream;
    }

    # Diagnostic endpoint returning Pod hostname and built App Version
    location = /k8s-info {
        default_type application/json;
        add_header X-Served-By $hostname always;
        add_header X-App-Version "__APP_VERSION__" always;
        add_header Cache-Control "no-store" always;
        return 200 '{"service":"frontend","version":"__APP_VERSION__","pod":"$hostname","status":"ok"}\n';
    }

    # Fallback to index.html for Single Page Application routing
    location / {
        add_header X-Served-By $hostname always;
        add_header X-App-Version "__APP_VERSION__" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
