apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techstore
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vlkorolenko/devops-lab1.git
    targetRevision: main
    path: charts/techstore
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-techstore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
