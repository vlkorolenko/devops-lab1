services:
  # ==========================================
  # Database: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shop-network

  # ==========================================
  # Microservice 1: Product Service (Spring Boot)
  # ==========================================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: shop-product-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: shop_user
      SPRING_DATASOURCE_PASSWORD: shop_password
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop-network

  # ==========================================
  # Microservice 2: Order Service (Spring Boot)
  # ==========================================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: shop-order-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
      SPRING_DATASOURCE_USERNAME: shop_user
      SPRING_DATASOURCE_PASSWORD: shop_password
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop-network

  # ==========================================
  # Frontend: Nginx Reverse Proxy & Storefront UI
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shop-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - product-service
      - order-service
    networks:
      - shop-network

volumes:
  postgres_data:
    driver: local

networks:
  shop-network:
    driver: bridge
