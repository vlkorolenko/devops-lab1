apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-techstore
  labels:
    app: postgres
    tier: database
    app.kubernetes.io/part-of: devops-techstore
spec:
  type: ClusterIP
  selector:
    app: postgres
    tier: database
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
