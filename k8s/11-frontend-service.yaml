apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devops-techstore
  labels:
    app: frontend
    tier: frontend
    app.kubernetes.io/part-of: devops-techstore
spec:
  type: NodePort
  selector:
    app: frontend
    tier: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
