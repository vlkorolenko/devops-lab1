apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: devops-techstore
  labels:
    app: order-service
    tier: backend
    app.kubernetes.io/part-of: devops-techstore
spec:
  type: ClusterIP
  selector:
    app: order-service
    tier: backend
  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: 8082
