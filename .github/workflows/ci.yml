name: Continuous Integration & Delivery (DevOps Lab 2)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # ==============================================================
  # Job 1: Build, Lint (Checkstyle), and Test for Backend Services
  # ==============================================================
  backend-ci:
    name: Backend CI (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # One failure does not cancel other jobs
      matrix:
        service: [product-service, order-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🔍 Static Code Analysis (Checkstyle)
        working-directory: ./${{ matrix.service }}
        run: |
          echo "Running Checkstyle static analysis for ${{ matrix.service }}..."
          mvn checkstyle:check -B

      - name: ⚙️ Build Service (${{ matrix.service }})
        working-directory: ./${{ matrix.service }}
        run: |
          echo "Compiling and packaging ${{ matrix.service }}..."
          mvn clean compile -B

      - name: 🧪 Run Unit & Integration Tests (${{ matrix.service }})
        working-directory: ./${{ matrix.service }}
        run: |
          echo "Executing tests for ${{ matrix.service }}..."
          mvn test -B

  # ==============================================================
  # Job 2: Frontend Validation (Docker Build & Assets)
  # ==============================================================
  frontend-ci:
    name: Frontend CI (Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Build Frontend Docker Image & Verify Assets
        run: |
          docker build -t frontend-check ./frontend
          test -f frontend/src/index.html || exit 1
          test -f frontend/src/app.js || exit 1
          test -f frontend/src/style.css || exit 1
          echo "Frontend assets and Dockerfile verified successfully!"

  # ==============================================================
  # Job 3: Build & Publish Container Images to GHCR
  # ==============================================================
  docker-build-and-push:
    name: Docker Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: product-service
            context: ./product-service
            image-name: product-service
          - service: order-service
            context: ./order-service
            image-name: order-service
          - service: frontend
            context: ./frontend
            image-name: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image-name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🛡️ Security Vulnerability Scan (Trivy FS Scan)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.context }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
