server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/shop_db}
    username: ${SPRING_DATASOURCE_USERNAME:shop_user}
    password: ${SPRING_DATASOURCE_PASSWORD:shop_password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

info:
  app:
    name: order-service
    version: ${APP_VERSION:1.0.0}
    environment: ${APP_ENVIRONMENT:docker}
    storeName: ${APP_STORE_NAME:DevOps TechStore}
